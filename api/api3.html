<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
     <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
     <style>
        table,tr,td,th{
            border:1px solid black;
            border-collapse:collapse;
            padding:5px
        }
     </style>
</head>
<body>
    <table id="table"></table>

    <script>
        onload=function(){
            getPatients()
        }
        function getPatients(){
            axios.get("https://doc-back.onrender.com/patients")
            .then((res)=>{
console.log(res.data);
displayData(res.data)
            })
        }

       function displayData(patients){
       
        let patients_field=document.getElementById("table");
         
        patients_field.innerHTML=`
        <tr>
            <th>Name</th>
            <th>Age</th>
            <th>Email</th>
        </tr>
        `

        patients.map((i)=>{
patients_field.innerHTML+=`
        <tr>
            <td>${i.name}</td>
            <td>${i.age}</td>
            <td>${i.email}</td>
        </tr>
        `
        })
        
       }

    </script>
</body>
</html>
